[project]
name = "factors-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in a parameter default is the framework's
# documented DI pattern, not the mutable-default-argument bug this rule
# targets.
# UP046: keep `class Foo(Generic[T])` rather than PEP 695 `class Foo[T]`
# syntax — more broadly familiar and matches the mediator's `Command[T]` /
# `Query[T]` base-class style used throughout the codebase.
ignore = ["B008", "UP046"]
